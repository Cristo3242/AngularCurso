

<h2>Lista de productos</h2>

@for (product of products; track product.id) {
    <div>
        <h3>{{ product.name}}</h3>
        <p>Precio: ${{ product.price }}</p>
        <p>Stock: {{ product.stock }}</p>
        <p>Categoria: {{ product.category }}</p>
       
    </div>

} @empty {
        <p>No hay productos registrados</p>
}
